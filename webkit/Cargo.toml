[package]
name = "mailrs-webkit"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The subset of webkit6's API the app uses, over WKWebView"

# WebKitGTK does not run on macOS, so this crate stands in for it with the
# same names. The app names only this crate, as `webkit`.
[dependencies]
gtk.workspace = true
futures.workspace = true
tracing.workspace = true
# Apple's frameworks from Rust, generated from their headers by the objc2
# project.
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSData", "NSError", "NSGeometry", "NSObject", "NSArray", "NSDictionary", "NSValue", "NSURLAuthenticationChallenge", "NSURLProtectionSpace", "NSURLCredential", "NSURLSession"] }
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSResponder", "NSColor", "NSPrintInfo", "NSPrintOperation", "NSGraphics", "NSApplication", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAShapeLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGPath"] }
objc2-web-kit = { version = "0.3.2", features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessageHandler", "WKScriptMessage", "WKUserScript", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKContentRuleList", "WKContentRuleListStore", "WKFrameInfo", "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebsiteDataStore", "WKPreferences", "WKWebpagePreferences", "WKFindConfiguration", "WKFindResult", "WKUIDelegate", "WKNavigationResponse", "WKSecurityOrigin"] }
