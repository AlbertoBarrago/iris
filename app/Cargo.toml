[package]
name = "mailrs"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mail and calendar for Linux"

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
mailrs-discover.workspace = true
mailrs-domain.workspace = true
mailrs-gmail.workspace = true
mailrs-graph.workspace = true
mailrs-imap.workspace = true
mailrs-mime.workspace = true
mailrs-store.workspace = true
# `--demo` runs on sync's in-memory Gmail, so the app asks for it.
mailrs-sync = { workspace = true, features = ["fake"] }
mailrs-ai.workspace = true
mailrs-pgp.workspace = true
mailrs-smime.workspace = true
mailrs-render.workspace = true
adw.workspace = true
ammonia.workspace = true
anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
sha2.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
# The editor's draft keeps the zone it opened in, at run time, not only
# under tests.
chrono-tz.workspace = true
futures.workspace = true
# Startup binds the text domain; the words themselves go through
# `mailrs_domain::translate`.
gettext-rs.workspace = true
gtk.workspace = true
# Asks whether a demo run's process is still alive (`kill(pid, 0)`).
libc.workspace = true
mail-builder.workspace = true
# The message inside an encrypted one arrives as MIME, not through Gmail.
mail-parser.workspace = true
notify-rust.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
spellbook.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The web source checks a page's host before it downloads anything.
url.workspace = true

# WKWebView behind the API of WebKitGTK's webkit6, which the app was
# written against.
webkit = { package = "mailrs-webkit", path = "../webkit" }

# AppKit for what macOS shows outside the window, such as the Dock badge.
# The same crates the webkit crate already uses.
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSBundle"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSDockTile", "NSResponder", "NSWorkspace", "NSPasteboard", "block2"] }

[dev-dependencies]
mail-parser.workspace = true
tempfile.workspace = true
wiremock.workspace = true
