# The SwiftUI front end of Iris. XcodeGen writes Iris.xcodeproj from this
# file, so the project itself stays out of version control:
#
#   cd macos && xcodegen
name: Iris
options:
  bundleIdPrefix: io.github.AlbertoBarrago
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Iris:
    type: application
    platform: macOS
    sources:
      - path: Iris
      # The GTK app's catalogs, which scripts/update-po.sh compiles; the
      # app reads them from Contents/Resources/locale.
      - path: ../target/locale
        type: folder
        buildPhase: resources
    dependencies:
      # Built first, so the library and the bindings are fresh before the
      # Swift sources compile against them.
      - target: IrisCore
      # What the Rust core reaches through the system: the network's
      # configuration, TLS and the Keychain.
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        # Its own id while the GTK app is the one people use, so the two
        # can run side by side.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.AlbertoBarrago.Iris.Next
        PRODUCT_NAME: Iris Next
        GENERATE_INFOPLIST_FILE: YES
        # The winged envelope, from scripts/macos-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Iris Next
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The identity the GTK app's bundle carries, which stays the same
        # from one build to the next. The Keychain ties "Always Allow" to
        # the signature, and an ad-hoc one changes with every build, so
        # each build asked for the Keychain again and accounts waited.
        CODE_SIGN_IDENTITY: albz Code Signing
        CODE_SIGN_STYLE: Manual
        # One binary, which the stable signature covers whole.
        ENABLE_DEBUG_DYLIB: NO
        # The prototype reads the store the GTK app keeps in
        # ~/Library/Application Support/iris, which a sandbox would close.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The core's module map and header, and the static library, read
        # straight from the build tree that scripts/build-ffi.sh fills.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../target/ffi/headers
        OTHER_LDFLAGS: $(SRCROOT)/../target/$(IRIS_CORE_PROFILE)/libmailrs_ffi.a
      configs:
        Debug:
          IRIS_CORE_PROFILE: debug
        Release:
          IRIS_CORE_PROFILE: release
aggregateTargets:
  IrisCore:
    buildScripts:
      # The Rust core and its Swift bindings, rebuilt when the core changed.
      - name: Build the Rust core
        script: '"$SRCROOT/../scripts/build-ffi.sh" "$( [ "$CONFIGURATION" = Release ] && echo release || echo debug )"'
        basedOnDependencyAnalysis: false
