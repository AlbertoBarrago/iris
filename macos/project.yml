# The SwiftUI front end of Iris. XcodeGen writes Iris.xcodeproj from this
# file, so the project itself stays out of version control:
#
#   cd macos && xcodegen
name: Iris
options:
  bundleIdPrefix: io.github.AlbertoBarrago
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Iris:
    type: application
    platform: macOS
    sources:
      - path: Iris
    dependencies:
      # Built first, so the framework and the bindings are fresh before
      # Xcode reads them; a script inside this target ran too late.
      - target: IrisCore
      - framework: IrisCore.xcframework
        embed: false
    settings:
      base:
        # Its own id while the GTK app is the one people use, so the two
        # can run side by side.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.AlbertoBarrago.Iris.Next
        PRODUCT_NAME: Iris Next
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Iris Next
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        # The prototype reads the store the GTK app keeps in
        # ~/Library/Application Support/iris, which a sandbox would close.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
aggregateTargets:
  IrisCore:
    buildScripts:
      # The Rust core and its Swift bindings, rebuilt when the core changed.
      - name: Build the Rust core
        script: '"$SRCROOT/../scripts/build-ffi.sh" "$( [ "$CONFIGURATION" = Release ] && echo release || echo debug )"'
        basedOnDependencyAnalysis: false
