# The SwiftUI front end of Iris. XcodeGen writes Iris.xcodeproj from this
# file, so the project itself stays out of version control:
#
#   cd macos && xcodegen
name: Iris
options:
  bundleIdPrefix: io.github.AlbertoBarrago
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # Updates, from the same appcast and with the same EdDSA key the GTK
  # app's builds used, so an installed Iris updates itself to this one.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Iris:
    type: application
    platform: macOS
    sources:
      - path: Iris
      # The catalogs scripts/update-po.sh compiles; the app reads them
      # from Contents/Resources/locale.
      - path: ../target/locale
        type: folder
        buildPhase: resources
      # The Add Account band's poses and the providers' logos, which
      # scripts/iris-art.py draws and data/ keeps.
      - path: ../data/band
        type: folder
        buildPhase: resources
      - path: ../data/logos
        type: folder
        buildPhase: resources
    dependencies:
      # Built first, so the library and the bindings are fresh before the
      # Swift sources compile against them.
      - target: IrisCore
      - package: Sparkle
      # What the Rust core reaches through the system: the network's
      # configuration, TLS and the Keychain.
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        # The id every Iris has had, so an update replaces the app in
        # place and macOS keeps its Login Items and notifications.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.AlbertoBarrago.Iris
        PRODUCT_NAME: Iris
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, which Xcode adds to the ones it writes itself.
        # scripts/macos-dmg.sh adds the public signing key.
        INFOPLIST_FILE: Info.plist
        # The winged envelope, from scripts/macos-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Iris
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "1.1.12"
        CURRENT_PROJECT_VERSION: "1.1.12"
        # An Apple Development identity, which carries a Team ID. The
        # Keychain keys "Always Allow" to the team; for an app with none it
        # keys it to the binary's hash, which every build changes, so each
        # build asked for the Keychain again and accounts waited on a
        # prompt. A contributor sets their own team here.
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: PW7G4XJ7H7
        CODE_SIGN_STYLE: Manual
        # One binary, which the stable signature covers whole.
        ENABLE_DEBUG_DYLIB: NO
        # Iris keeps its store in ~/Library/Application Support/iris and
        # runs gpg and gpgsm, which a sandbox would close.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The core's module map and header, and the static library, read
        # straight from the build tree that scripts/build-ffi.sh fills.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../target/ffi/headers
        OTHER_LDFLAGS: $(SRCROOT)/../target/$(IRIS_CORE_PROFILE)/libmailrs_ffi.a
      configs:
        Debug:
          IRIS_CORE_PROFILE: debug
        Release:
          IRIS_CORE_PROFILE: release
aggregateTargets:
  IrisCore:
    buildScripts:
      # The Rust core and its Swift bindings, rebuilt when the core changed.
      - name: Build the Rust core
        script: '"$SRCROOT/../scripts/build-ffi.sh" "$( [ "$CONFIGURATION" = Release ] && echo release || echo debug )"'
        basedOnDependencyAnalysis: false
